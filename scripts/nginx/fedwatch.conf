# fedwatch-tracker 静态站点：接管裸 IP:80 的 default_server。
# 安装位置：/etc/nginx/conf.d/fedwatch.conf（由 scripts/server/bootstrap.sh 部署）。
# va2t.conf 原 default_server（return 444 空吞块）由 bootstrap 备份后移除，va2t 域名站不受影响。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/fedwatch/current;
    index index.html;

    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;

    # Cloudflare Pages 专用配置文件，不应被当作内容服务。
    location = /_headers { return 404; }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
